<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVID — Parolni tiklash</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/polish.css">
</head>
<body class="page-inner auth-page school-theme" data-nav="forgot" data-auth-page="forgot">
    <header class="header">
        <a href="index.html"><img class="header-logo" src="./img/logo.png" alt="AVID"></a>
        <div class="toggle"></div>
        <ol class="header-nav">
            <li><a href="index.html" class="header-nav-item">Bosh menyu</a></li>
            <li><a href="login.html" class="header-nav-item">Kirish</a></li>
        </ol>
        <div class="header-login"></div>
    </header>
    <main>
        <div class="auth-card">
            <h1>Parolni tiklash</h1>
            <form id="auth-form">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <button type="submit">Havola yuborish</button>
            </form>
            <p class="form-feedback" id="auth-feedback"></p>
            <div class="auth-links"><a href="login.html">← Kirish</a></div>
        </div>
    </main>
    <script src="./js/api.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/auth-pages.js"></script>
</body>
</html>
