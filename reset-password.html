<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVID — Yangi parol</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/polish.css">
</head>
<body class="page-inner auth-page school-theme" data-nav="reset" data-auth-page="reset">
    <header class="header">
        <a href="index.html"><img class="header-logo" src="./img/logo.png" alt="AVID"></a>
        <div class="header-login"></div>
    </header>
    <main>
        <div class="auth-card">
            <h1>Yangi parol</h1>
            <form id="auth-form">
                <label for="password">Yangi parol</label>
                <input type="password" id="password" name="password" required minlength="8">
                <label for="password2">Tasdiqlang</label>
                <input type="password" id="password2" name="password2" required minlength="8">
                <button type="submit">Saqlash</button>
            </form>
            <p class="form-feedback" id="auth-feedback"></p>
        </div>
    </main>
    <script src="./js/api.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/auth-pages.js"></script>
</body>
</html>
