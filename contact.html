    <main>
        <section class="contact">
            <div class="page-intro">
                <h1>Aloqa</h1>
                <p>Kurslar, hamkorlik yoki texnik savollar — yozing, javob beramiz.</p>
            </div>
            <div class="contact-info">
                <p>Formani to'ldiring yoki to'g'ridan-to'g'ri email yuboring.</p>
                <p>Email: <a href="mailto:info@avid.uz">info@avid.uz</a></p>
            </div>
            <form class="contact-form" novalidate>
                <div>
                    <label for="name">Ismingiz</label>
                    <input type="text" id="name" name="name" placeholder="Ismingiz" required>
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="email@example.com" required>
                </div>
                <div>
                    <label for="message">Xabar</label>
                    <textarea id="message" name="message" placeholder="Xabaringizni yozing..." required minlength="10"></textarea>
                </div>
                <p class="form-feedback" aria-live="polite"></p>
                <button type="submit">Yuborish</button>
            </form>
        </section>
    </main>
