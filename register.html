<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVID — Ro'yxatdan o'tish</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/polish.css">
</head>
<body class="page-inner auth-page school-theme" data-nav="register" data-auth-page="register">
    <header class="header">
        <a href="index.html"><img class="header-logo" src="./img/logo.png" alt="AVID"></a>
        <div class="toggle"></div>
        <ol class="header-nav">
            <li><a href="index.html" class="header-nav-item">Bosh menyu</a></li>
            <li><a href="blog.html" class="header-nav-item">Blog</a></li>
            <li><a href="about.html" class="header-nav-item">Biz haqimizda</a></li>
            <li><a href="contact.html" class="header-nav-item">Aloqa</a></li>
        </ol>
        <div class="header-login"></div>
    </header>
    <main>
        <div class="auth-card">
            <h1>Ro'yxatdan o'tish</h1>
            <form id="auth-form">
                <label for="name">Ism</label>
                <input type="text" id="name" name="name" required minlength="2">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
                <label for="password">Parol (min 8, harf + raqam)</label>
                <input type="password" id="password" name="password" required minlength="8">
                <label for="password2">Parolni tasdiqlang</label>
                <input type="password" id="password2" name="password2" required>
                <label for="role">Rol</label>
                <select id="role" name="role">
                    <option value="student">Talaba (Student)</option>
                    <option value="instructor">O'qituvchi (Instructor)</option>
                </select>
                <button type="submit">Ro'yxatdan o'tish</button>
            </form>
            <p class="form-feedback" id="auth-feedback"></p>
            <div class="auth-links"><a href="login.html">Allaqachon akkauntingiz bormi?</a></div>
        </div>
    </main>
    <footer class="footer">
        <div class="footer-info">&copy; <span id="year"></span> | By <a href="https://github.com/ufxzche">Avid.uz</a></div>
    </footer>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
    <script src="./js/api.js"></script>
    <script src="./js/layout.js"></script>
    <script src="./js/main.js"></script>
    <script src="./js/auth-pages.js"></script>
</body>
</html>
